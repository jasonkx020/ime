[workspace]
resolver = "2"
members = [
    "crates/yc-types",
    "crates/yc-lexicon",
    "crates/yc-engine",
    "crates/yc-session",
    "crates/yc-ffi",
    "crates/yc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
parking_lot = "0.12"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
