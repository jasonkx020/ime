[workspace]
resolver = "2"
members = [
    "crates/foundation/yc-types",
    "crates/hot/yc-lexicon",
    "crates/hot/yc-scheme",
    "crates/hot/yc-layout",
    "crates/hot/yc-intel",
    "crates/hot/yc-engine",
    "crates/hot/yc-session",
    "crates/cold/yc-pack",
    "crates/cold/yc-theme",
    "crates/cold/yc-plugin",
    "crates/cold/yc-data",
    "crates/features/yc-handwriting",
    "crates/features/yc-ai",
    "crates/features/yc-ext",
    "crates/boundary/yc-ffi",
    "crates/apps/yc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
parking_lot = "0.12"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
