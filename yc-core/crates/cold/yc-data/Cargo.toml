[package]
name = "yc-data"
version.workspace = true
edition.workspace = true

[dependencies]
yc-types = { path = "../../foundation/yc-types" }
yc-pack = { path = "../yc-pack" }
yc-theme = { path = "../yc-theme" }
yc-lexicon = { path = "../../hot/yc-lexicon" }
parking_lot.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[features]
default = []
plugin = ["dep:yc-plugin"]

[dependencies.yc-plugin]
path = "../yc-plugin"
optional = true
